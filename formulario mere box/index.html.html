<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meré Boxing Academy - Formulario de Inscripción</title>
  <!-- Librería externa para renderizado perfecto de imagen -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Cinzel:wght@700&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #dcd6cd;
      font-family: 'EB Garamond', Georgia, serif;
      color: #1a1a1a;
      padding: 15px 10px;
      line-height: 1.35;
    }

    .form-container {
      max-width: 800px;
      margin: 0 auto;
      background-color: #f6f1e3;
      border: 2px solid #8b7355;
      box-shadow: 0 4px 15px rgba(0,0,0,0.15);
      padding: 25px 30px;
      position: relative;
    }

    .header-grid {
      display: grid;
      grid-template-columns: 1fr 130px;
      align-items: center;
      gap: 15px;
      margin-bottom: 15px;
      border-bottom: 2px double #8b7355;
      padding-bottom: 15px;
    }

    .logo-container {
      text-align: center;
    }

    .logo-svg {
      max-width: 340px;
      height: auto;
    }

    .photo-box {
      border: 2px dashed #8b7355;
      background-color: rgba(139, 115, 85, 0.05);
      height: 150px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      padding: 5px;
    }

    .photo-box svg {
      width: 30px;
      height: 30px;
      fill: #8b7355;
      margin-bottom: 5px;
    }

    .photo-box span {
      font-size: 11px;
      font-weight: bold;
      color: #6b5535;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .photo-box input[type="file"] {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      cursor: pointer;
      z-index: 10;
    }

    .photo-box img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
      z-index: 5;
    }

    h1 {
      font-family: 'Cinzel', serif;
      font-size: 21px;
      text-align: center;
      letter-spacing: 1px;
      margin-bottom: 3px;
      color: #000;
    }

    .subtitle {
      font-size: 11px;
      font-weight: bold;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 20px;
      color: #2c2c2c;
    }

    .section-title {
      font-size: 14px;
      font-weight: 700;
      text-transform: uppercase;
      margin-top: 15px;
      margin-bottom: 10px;
      color: #000;
      border-bottom: 1px solid #c5b8a5;
      padding-bottom: 2px;
    }

    .form-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 8px;
    }

    .form-group {
      flex: 1;
      min-width: 200px;
      display: flex;
      align-items: baseline;
      gap: 6px;
    }

    .form-group.full-width {
      flex: 100%;
    }

    .form-group label {
      font-size: 13.5px;
      font-weight: 600;
      white-space: nowrap;
    }

    .form-group input[type="text"],
    .form-group input[type="tel"],
    .form-group input[type="email"],
    .form-group input[type="date"] {
      flex: 1;
      background: transparent;
      border: none;
      border-bottom: 1px solid #1a1a1a;
      font-family: 'EB Garamond', serif;
      font-size: 15px;
      padding: 1px 4px;
      color: #000;
      outline: none;
    }

    .legal-text {
      font-size: 11.5px;
      text-align: justify;
      color: #2b2b2b;
      margin-bottom: 8px;
    }

    .checkbox-group {
      margin: 6px 0;
      font-size: 12.5px;
    }

    .checkbox-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 3px 0;
    }

    .checkbox-options {
      display: flex;
      gap: 12px;
    }

    .checkbox-options label {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 11.5px;
      font-weight: bold;
      cursor: pointer;
    }

    .signature-area {
      margin-top: 10px;
      border: 1px solid #1a1a1a;
      background-color: #fff;
      position: relative;
    }

    canvas {
      width: 100%;
      height: 110px;
      display: block;
      cursor: crosshair;
    }

    .clear-btn {
      position: absolute;
      top: 4px;
      right: 4px;
      background: #8b7355;
      color: #fff;
      border: none;
      padding: 2px 7px;
      font-size: 10px;
      cursor: pointer;
      border-radius: 2px;
      z-index: 15;
    }

    .btn-container {
      margin-top: 25px;
    }

    .submit-btn {
      width: 100%;
      padding: 14px;
      background-color: #25d366;
      color: #fff;
      border: none;
      font-family: 'Cinzel', serif;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s;
      text-align: center;
      border-radius: 3px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }

    .submit-btn:hover {
      background-color: #1eb855;
    }

    @media (max-width: 600px) {
      .header-grid {
        grid-template-columns: 1fr;
      }
      .photo-box {
        height: 120px;
        width: 130px;
        margin: 0 auto;
      }
    }
  </style>
</head>
<body>

<div class="form-container" id="printableForm">
  <form id="registrationForm" onsubmit="event.preventDefault(); processAndSaveImage();">
    
    <div class="header-grid">
      <div class="logo-container">
        <!-- LOGO VECTORIAL DETALLADO: MERE BOXING ACADEMY (SINCE 2010) -->
        <svg class="logo-svg" viewBox="0 0 350 200" xmlns="http://www.w3.org/2000/svg">
          <path id="archPath" d="M 45,55 A 135,135 0 0,1 305,55" fill="none"/>
          <text font-family="'Cinzel', serif" font-weight="bold" font-size="24" fill="#a68038" text-anchor="middle" letter-spacing="2.5">
            <textPath href="#archPath" startOffset="50%">OLD SCHOOL
